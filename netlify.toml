[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/apis"
  to = "/apis.html"
  status = 200

[[redirects]]
  from = "/guaid"
  to = "/guaid.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
