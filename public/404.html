<!DOCTYPE html>
<html lang="en" class="h-full antialiased dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>404 — Page Not Found | LUKZI VS SOCIAL MEDIA</title>
  <link rel="icon" href="/lukzi-logo.png" type="image/png"/>
  <link rel="stylesheet" href="/style.css"/>
  <script>
    (function(){
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (!prefersDark) document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
